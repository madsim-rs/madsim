[package]
name = "madsim-aws-sdk-s3"
version = "0.5.0+1"
edition = "2021"
authors = ["Kevin Axel <kevinaxel@163.com>"]
description = "The s3 simulator on madsim."
homepage = "https://github.com/madsim-rs/madsim"
repository = "https://github.com/madsim-rs/madsim"
categories = ["network-programming", "asynchronous", "simulation"]
keywords = ["s3", "api", "client", "async", "simulator"]
readme = "README.md"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aws-sdk-s3 = { version = "1", default-features = false, features = ["http-1x", "sigv4a"] }

[target.'cfg(madsim)'.dependencies]
madsim = { version = "0.2.15", path = "../madsim" }
aws-smithy-http = "0.60"
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
aws-types = "1"
bytes = "1"
http = "1"
spin = "0.9"
tracing = "0.1"

[features]
# Keep the public `rustls` feature name for compatibility, but use the AWS SDK's
# newer default HTTPS client stack instead of the legacy hyper 0.14 path.
rustls = ["aws-sdk-s3/default-https-client"]
rt-tokio = ["aws-sdk-s3/rt-tokio"]
default = ["rustls", "rt-tokio"]

[lints]
workspace = true
